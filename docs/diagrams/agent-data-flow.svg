<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 684" width="760" height="684" role="img" aria-labelledby="title desc">
  <title id="title">Agent run data flow</title>
  <desc id="desc">A user goal enters AgentManager.run_agent_loop(), which runs plan, think, act, observe and reflect in sequence, looping until it finishes or reaches its iteration limit.</desc>
  <rect x="0.5" y="0.5" width="759" height="683" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="380.0" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17px" fill="#0f172a" text-anchor="middle" font-weight="600">Agent run</text><text x="380.0" y="59" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="middle">from a goal to a result</text><text x="220" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">User goal</text><path d="M 220 100 L 220 118" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 118.0 L 213.8 105.7 L 226.2 105.7 Z" fill="#94a3b8" stroke="none"/><rect x="115.0" y="124" width="210" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="220" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">AgentManager</text><text x="220" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5px" fill="#475569" text-anchor="middle">.run_agent_loop()</text><rect x="115.0" y="214" width="210" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="244.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">Plan</text><path d="M 329.0 240.0 L 365.0 240.0" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 365.0 240.0 L 352.6 246.2 L 352.6 233.8 Z" fill="#94a3b8" stroke="none"/><text x="375.0" y="244.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="start">create a high-level strategy</text><rect x="115.0" y="290" width="210" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="320.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">Think</text><path d="M 329.0 316.0 L 365.0 316.0" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 365.0 316.0 L 352.6 322.2 L 352.6 309.8 Z" fill="#94a3b8" stroke="none"/><text x="375.0" y="320.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="start">decide the next action or tool</text><path d="M 220 269 L 220 287" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 287.0 L 213.8 274.6 L 226.2 274.6 Z" fill="#94a3b8" stroke="none"/><rect x="115.0" y="366" width="210" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="396.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">Act</text><path d="M 329.0 392.0 L 365.0 392.0" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 365.0 392.0 L 352.6 398.2 L 352.6 385.8 Z" fill="#94a3b8" stroke="none"/><text x="375.0" y="396.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="start">execute the tool, in a sandbox</text><path d="M 220 345 L 220 363" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 363.0 L 213.8 350.6 L 226.2 350.6 Z" fill="#94a3b8" stroke="none"/><rect x="115.0" y="442" width="210" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="472.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">Observe</text><path d="M 329.0 468.0 L 365.0 468.0" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 365.0 468.0 L 352.6 474.2 L 352.6 461.8 Z" fill="#94a3b8" stroke="none"/><text x="375.0" y="472.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="start">process the tool result</text><path d="M 220 421 L 220 439" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 439.0 L 213.8 426.6 L 226.2 426.6 Z" fill="#94a3b8" stroke="none"/><rect x="115.0" y="518" width="210" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="548.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#0f172a" text-anchor="middle" font-weight="600">Reflect</text><path d="M 329.0 544.0 L 365.0 544.0" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 365.0 544.0 L 352.6 550.2 L 352.6 537.8 Z" fill="#94a3b8" stroke="none"/><text x="375.0" y="548.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="start">update state, log the episode</text><path d="M 220 497 L 220 515" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 515.0 L 213.8 502.6 L 226.2 502.6 Z" fill="#94a3b8" stroke="none"/><path d="M 220 189 L 220 211" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 211.0 L 213.8 198.7 L 226.2 198.7 Z" fill="#94a3b8" stroke="none"/><text x="220" y="596" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#7c3aed" text-anchor="middle">loop until finished or the iteration ceiling is hit</text><path d="M 220 604 L 220 626" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M 220.0 626.0 L 213.8 613.6 L 226.2 613.6 Z" fill="#94a3b8" stroke="none"/><text x="220" y="646" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13px" fill="#059669" text-anchor="middle" font-weight="600">Final result</text>
</svg>
