<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The cognitive cycle</title>
  <desc id="desc">Eight phases run in a loop: perceive, plan, think, validate, act, observe, reflect, update. The top row runs left to right, the bottom row right to left, and update feeds back into perceive.</desc>
  <rect x="0.5" y="0.5" width="879" height="329" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="440.0" y="42" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17px" fill="#0f172a" text-anchor="middle" font-weight="600">Cognitive cycle</text><text x="440.0" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12px" fill="#475569" text-anchor="middle">one iteration of an agent run</text><rect x="68.0" y="92" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="152.0" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">PERCEIVE</text><text x="152.0" y="143" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">analyse goal</text><path d="M 239.0 128.0 L 257.0 128.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 257.0 128.0 L 244.7 134.2 L 244.7 121.8 Z" fill="#7c3aed" stroke="none"/><rect x="260.0" y="92" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="344.0" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">PLAN</text><text x="344.0" y="143" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">form strategy</text><path d="M 431.0 128.0 L 449.0 128.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 449.0 128.0 L 436.6 134.2 L 436.6 121.8 Z" fill="#7c3aed" stroke="none"/><rect x="452.0" y="92" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="536.0" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">THINK</text><text x="536.0" y="143" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">decide action</text><path d="M 623.0 128.0 L 641.0 128.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 641.0 128.0 L 628.6 134.2 L 628.6 121.8 Z" fill="#7c3aed" stroke="none"/><rect x="644.0" y="92" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="728.0" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">VALIDATE</text><text x="728.0" y="143" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">check validity</text><rect x="644.0" y="204" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="728.0" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">ACT</text><text x="728.0" y="255" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">execute</text><path d="M 641.0 240.0 L 623.0 240.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 623.0 240.0 L 635.4 233.8 L 635.4 246.2 Z" fill="#7c3aed" stroke="none"/><rect x="452.0" y="204" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="536.0" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">OBSERVE</text><text x="536.0" y="255" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">read results</text><path d="M 449.0 240.0 L 431.0 240.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 431.0 240.0 L 443.4 233.8 L 443.4 246.2 Z" fill="#7c3aed" stroke="none"/><rect x="260.0" y="204" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="344.0" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">REFLECT</text><text x="344.0" y="255" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">learn</text><path d="M 257.0 240.0 L 239.0 240.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 239.0 240.0 L 251.3 233.8 L 251.3 246.2 Z" fill="#7c3aed" stroke="none"/><rect x="68.0" y="204" width="168" height="72" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="152.0" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5px" fill="#0f172a" text-anchor="middle" font-weight="600">UPDATE</text><text x="152.0" y="255" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5px" fill="#475569" text-anchor="middle">state &amp; memory</text><path d="M 728.0 167 L 728.0 201" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 728.0 201.0 L 721.8 188.7 L 734.2 188.7 Z" fill="#7c3aed" stroke="none"/><path d="M 152.0 201 L 152.0 167" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M 152.0 167.0 L 158.2 179.3 L 145.8 179.3 Z" fill="#7c3aed" stroke="none"/><text x="140.0" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11px" fill="#475569" text-anchor="end">next iteration</text>
</svg>
