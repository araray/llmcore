# tools/cardctl/enrichments/commandcode.toml
# Manual enrichment overlay for Command Code's Provider API.
#
# GET /provider/v1/models states id, name, context_length and routes, and no
# prices. Every price below is transcribed from Command Code's own pricing page,
# which is a vendor-native source:
#   https://commandcode.ai/docs/resources/pricing-limits  ("Model pricing. At cost.")
# USD per 1M tokens. cached_input = cache read, cache_write = cache write.
# Last updated: 2026-11-15 (102 rows on the page; the 98 served by /models,
# plus Jev and Jev 1.14.0, which are served on /systemone only. Claude Opus 4.6
# and Sonnet 4.5 are priced on the page but not served, so they get no card.)
#
# Pricing policy:
# - Peak/off-peak (DeepSeek V4.x). The page headlines the off-peak rate (17 h a
#   day). The card schema has no time-of-day pricing, so the card's price is
#   the PEAK rate, and spend estimates never come in low. The off-peak rate and
#   its schedule live in provider_extension.off_peak. Peak cache-read rates are
#   not published, so cached_input stays at the published figure.
# - Temporary deals (MiniMax M3, -50%). The card's price is the LIST price, for
#   the same reason. The deal price is in provider_extension.deal.
# - Open-weights rows are the mean price across Command Code's upstreams.

