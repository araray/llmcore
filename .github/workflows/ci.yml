# Per-PR CI Pipeline for llmcore.
# Runs unit tests only — no API keys, no Docker/VM sandboxes, no Postgres.
# Integration/e2e suites (tests/integration/, keyed provider tests) are excluded
# via path ignores and markers.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff

      # Blocking gate: syntax errors and obvious logic bugs only. The full
      # repo ruff config still reports pre-existing findings; tighten this
      # gate as the backlog is cleaned up.
      - name: ruff check (blocking gate)
        run: ruff check src/ tests/ --select E9,F63,F7

      - name: ruff check (advisory, full config)
        run: ruff check src/ tests/ --exit-zero

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # confy is not published on PyPI (the PyPI 'confy' is an unrelated
          # package capped at 0.3.8); install it from its public GitHub repo
          # first so the llmcore resolve below finds confy>=0.4.2 satisfied.
          pip install "confy @ git+https://github.com/araray/confy.git@v0.4.2"
          # grimoire (the control plane) is also GitHub-only.
          pip install "grimoire @ git+https://github.com/araray/grimoire.git@v0.4.0"
          # dev pulls in test (pytest, pytest-asyncio, respx, ...) and sandbox
          # deps; [all] pulls every provider/search/storage extra plus the
          # bridge deps (grpcio/protobuf/starlette) that unit tests import at
          # collection or fixture time. Installing [all] rather than a
          # hand-maintained subset means a new extra is exercised in CI the
          # moment it is added to pyproject.
          #
          # Optional vendor SDKs (zai-sdk, friendli, ...) are installed on
          # purpose: every provider test pins its `backend` explicitly, so the
          # presence of a vendor SDK can no longer bypass the mocks and reach a
          # live API. See docs/PROVIDER_MODERNIZATION_PLAN.md §9.
          #
          # NOTE: openai>=3 and anthropic>=1 are built on httpx2 and no longer
          # install httpx/certifi transitively; the provider extras declare
          # httpx explicitly where llmcore's own clients need it.
          pip install -e ".[dev,all]"
          pip install numpy

      - name: Version drift guard
        run: |
          python - <<'EOF'
          import importlib.metadata
          import tomllib

          import llmcore

          meta = importlib.metadata.version("llmcore")
          with open("pyproject.toml", "rb") as fh:
              pyproject = tomllib.load(fh)["project"]["version"]

          print(f"llmcore.__version__      = {llmcore.__version__}")
          print(f"importlib.metadata       = {meta}")
          print(f"pyproject [project].version = {pyproject}")
          assert llmcore.__version__ == meta == pyproject, "version drift detected"
          EOF

      - name: Run unit tests
        run: |
          python -m pytest tests \
            --ignore=tests/integration \
            --ignore=tests/adhoc_checks \
            -m "not slow and not integration and not docker and not vm and not sandbox and not requires_postgres and not requires_pgvector and not requires_ollama" \
            -q
